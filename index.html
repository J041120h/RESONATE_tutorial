<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RESONATE documentation</title>
    <meta http-equiv="refresh" content="0; url=./site/" />
    <link rel="canonical" href="./site/" />
    <script>
      window.location.replace("./site/");
    </script>
    <style>
      :root { color-scheme: light dark; --slate: #33485d; --teal: #0a7a66; --bg: #fafbfb; --text: #1f2a35; }
      @media (prefers-color-scheme: dark) { :root { --bg: #11181f; --text: #e6edf2; --teal: #4cc9ae; } }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
             background: var(--bg); color: var(--text); }
      main { min-height: 100vh; display: grid; place-items: center; padding: 2rem 16px; }
      section { max-width: 32rem; border-top: 4px solid #10b396; padding: 1.5rem 0; }
      h1 { font-size: 1.5rem; margin: 0.3rem 0 0.8rem; }
      p.eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.75rem; margin: 0; opacity: 0.75; }
      a { color: var(--teal); }
    </style>
  </head>
  <body>
    <main>
      <section>
        <p class="eyebrow">RESONATE documentation</p>
        <h1>Redirecting&hellip;</h1>
        <p>If you are not redirected automatically, <a href="./site/">open the documentation</a>.</p>
      </section>
    </main>
  </body>
</html>
